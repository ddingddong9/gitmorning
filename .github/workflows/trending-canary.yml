name: Trending canary
# Detects GitHub Trending layout changes early. On failure it opens (or comments
# on) one issue labeled trending-canary; it never edits code or data.
on:
  schedule:
    # Four times a day: GitHub may delay or drop scheduled runs (it skipped the first one),
    # so one missed run is covered by the next. 22:17 UTC is 07:17 KST, before the morning read.
    - cron: '17 4,10,16,22 * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: trending-canary
  cancel-in-progress: false
jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Parse live daily and weekly pages
        id: canary
        run: python -m pipeline.canary 2> canary-error.txt
      - name: Report failure as an issue
        if: failure() && steps.canary.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="$(printf 'The daily Trending canary failed.\n\n```\n%s\n```\n\nRun: %s\n\nCheck pipeline/collect.py and Sources/GitMorningCore/TrendingReader.swift together, then update pipeline/tests/fixtures/parity.' "$(cat canary-error.txt)" "$RUN_URL")"
          gh label create trending-canary --color D93F0B --description "Live Trending parse check failed" 2>/dev/null || true
          existing="$(gh issue list --label trending-canary --state open --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "Trending canary: live page no longer parses as expected" --label trending-canary --body "$body"
          fi
