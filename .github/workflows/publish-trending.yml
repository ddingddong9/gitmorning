name: Publish Trending feed
# Collects GitHub Trending once an hour and publishes it to GitHub Pages, so every
# GitMorning app reads one small JSON file instead of each app parsing GitHub's page.
on:
  schedule:
    # Minute 41, away from the busy start of the hour when GitHub delays or drops scheduled runs.
    - cron: '41 * * * *'
  workflow_dispatch:
# The collector only reads; Pages deploy permissions are granted to the deploy job alone.
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python feed/build_site.py --output site
        env:
          # Read-only README requests; cached by ETag so unchanged READMEs are free.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
