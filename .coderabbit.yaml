# CodeRabbit reviews pull requests (free for public repositories). It reads AGENTS.md and
# CLAUDE.md on its own, so the project rules and Code Review Rules there apply; this file only
# sets the language, tone, and what to skip. A review is advice: CI and the maintainer decide.
language: "ko-KR"
reviews:
  profile: "chill"
  auto_review:
    enabled: true
    drafts: false
  path_filters:
    # Data refreshed by workflows or generated by scripts, not written by hand.
    - "!Sources/GitMorning/Resources/Snapshots/**"
    - "!Sources/GitMorningCore/HTMLEntities.swift"
    - "!media/readme-demo/package-lock.json"
    - "!docs/**/*.png"
    - "!docs/**/*.gif"
    - "!web/media/**"
    - "!media/readme-demo/public/**"
  path_instructions:
    - path: "pipeline/tests/fixtures/parity/**"
      instructions: >-
        These fixtures are shared by the Python and Swift Trending parsers. Flag a fixture whose
        expected JSON changed without a matching change in both pipeline/collect.py and
        Sources/GitMorningCore/TrendingReader.swift, or whose new output looks like it was copied
        from the parser instead of from the HTML.
    - path: "Sources/GitMorning/Resources/Korean.json"
      instructions: >-
        Korean interface strings. Check that the Korean matches the English key in meaning, stays
        short, and uses the same terms as nearby entries (보관함, 트렌드, 아침 브리핑).
